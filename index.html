<title>Elden Ring — Completion Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --gold-dim: #7a6230;
    --ember: #b84a1a;
    --ember-glow: #e05a20;
    --bg-deep: #0a0806;
    --bg-mid: #100d09;
    --bg-panel: #15100c;
    --bg-card: #1a1410;
    --border: #2e2218;
    --border-gold: #3d2e18;
    --text: #c8b89a;
    --text-dim: #7a6a54;
    --text-bright: #e8d8b8;
    --grace: #f0c040;
    --complete: #4a8c4a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'Crimson Text', Georgia, serif;
    font-size: 17px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(201,168,76,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(184,74,26,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── HEADER ── */
  header {
    position: relative;
    text-align: center;
    padding: 56px 24px 36px;
    border-bottom: 1px solid var(--border-gold);
    background: linear-gradient(180deg, #080604 0%, transparent 100%);
  }

  .rune-decoration {
    font-size: 13px;
    letter-spacing: 8px;
    color: var(--gold-dim);
    text-transform: uppercase;
    font-family: 'Cinzel', serif;
    margin-bottom: 12px;
    opacity: 0.7;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: clamp(2rem, 5vw, 3.6rem);
    color: var(--gold-light);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 60px rgba(201,168,76,0.3), 0 2px 4px rgba(0,0,0,0.8);
    line-height: 1.1;
  }

  .subtitle {
    font-family: 'Crimson Text', serif;
    font-style: italic;
    color: var(--text-dim);
    margin-top: 8px;
    font-size: 1.1rem;
    letter-spacing: 1px;
  }

  /* ── TOTAL PROGRESS ── */
  .total-progress {
    max-width: 640px;
    margin: 32px auto 0;
    padding: 0 24px;
  }

  .total-label {
    display: flex;
    justify-content: space-between;
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 8px;
  }

  .total-label span:last-child { color: var(--gold); font-weight: 600; }

  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold-light));
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 8px rgba(201,168,76,0.5);
  }

  /* ── NAV TABS ── */
  .nav-wrapper {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,8,6,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }

  .nav-scroll {
    display: flex;
    gap: 2px;
    padding: 0 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .nav-scroll::-webkit-scrollbar { display: none; }

  .tab-btn {
    flex-shrink: 0;
    padding: 14px 18px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
  }

  .tab-btn:hover { color: var(--text); }

  .tab-btn.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  /* ── MAIN CONTENT ── */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px 80px;
    position: relative;
    z-index: 1;
  }

  .section { display: none; }
  .section.active { display: block; }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-gold);
  }

  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 2px;
  }

  .section-count {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .section-count span { color: var(--gold); }

  /* ── SECTION PROGRESS ── */
  .section-progress { margin-bottom: 24px; }
  .section-progress .progress-track { height: 3px; }

  .section-progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  /* ── CHECKLIST ── */
  .checklist {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .check-item-wrap {
    display: flex;
    flex-direction: column;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 3px;
    transition: border-color 0.15s;
  }

  .check-item-wrap:hover { border-color: var(--border-gold); }
  .check-item-wrap.done { background: rgba(74,140,74,0.06); border-color: rgba(74,140,74,0.2); }

  .check-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }

  .check-item:hover { background: rgba(255,255,255,0.02); }

  .check-item-wrap.done .item-name {
    color: var(--text-dim);
    text-decoration: line-through;
    text-decoration-color: var(--text-dim);
  }

  .check-box {
    width: 18px;
    height: 18px;
    border: 1px solid var(--border-gold);
    border-radius: 2px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
    background: var(--bg-deep);
  }

  .check-item-wrap.done .check-box { background: var(--complete); border-color: var(--complete); }

  .check-box svg { opacity: 0; transition: opacity 0.15s; }
  .check-item-wrap.done .check-box svg { opacity: 1; }

  .item-name {
    flex: 1;
    color: var(--text-bright);
    font-size: 1rem;
    transition: color 0.15s;
  }

  .item-note {
    font-size: 0.82rem;
    color: var(--text-dim);
    font-style: italic;
    flex-shrink: 0;
  }

  /* ── NOTE BUTTON ── */
  .note-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 3px;
    color: var(--text-dim);
    font-size: 0.78rem;
    font-family: 'Cinzel', serif;
    letter-spacing: 1px;
    transition: color 0.15s, background 0.15s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .note-btn:hover { color: var(--gold); background: rgba(201,168,76,0.08); }
  .note-btn.has-note { color: var(--gold-dim); }
  .note-btn svg { flex-shrink: 0; }

  /* ── NOTE AREA ── */
  .note-area {
    display: none;
    padding: 0 16px 12px 48px;
  }

  .note-area.open { display: block; }

  .note-textarea {
    width: 100%;
    background: var(--bg-deep);
    border: 1px solid var(--border-gold);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Crimson Text', serif;
    font-size: 0.95rem;
    padding: 8px 12px;
    resize: vertical;
    min-height: 60px;
    outline: none;
    transition: border-color 0.15s;
    line-height: 1.5;
  }

  .note-textarea::placeholder { color: var(--text-dim); font-style: italic; }
  .note-textarea:focus { border-color: var(--gold-dim); }

  /* ── SUBSECTION ── */
  .subsection { margin-bottom: 28px; }

  .subsection-title {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 10px;
    padding-left: 4px;
  }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    padding: 8px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-gold);
    border-radius: 3px;
    color: var(--gold-dim);
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }

  .ctrl-btn:hover { background: var(--border-gold); color: var(--gold-light); }

  .ctrl-btn.danger { border-color: rgba(184,74,26,0.4); color: rgba(184,74,26,0.7); }
  .ctrl-btn.danger:hover { background: rgba(184,74,26,0.15); color: var(--ember-glow); }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 24px;
    color: var(--text-dim);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
    font-style: italic;
  }

  footer a { color: var(--gold-dim); text-decoration: none; }
  footer a:hover { color: var(--gold); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-deep); }
  ::-webkit-scrollbar-thumb { background: var(--border-gold); border-radius: 3px; }

  @media (max-width: 600px) {
    h1 { font-size: 1.8rem; }
    .check-item { padding: 10px 12px; }
    .item-note { display: none; }
    .note-area { padding-left: 16px; }
  }
</style>

      { id: 'ach8', name: 'Shardbearer Morgott', note: 'Defeat Morgott' },
      { id: 'ach9', name: 'Shardbearer Rykard', note: 'Defeat Rykard' },
      { id: 'ach10', name: 'Shardbearer Malenia', note: 'Defeat Malenia' },
      { id: 'ach11', name: 'Shardbearer Mohg', note: 'Defeat Mohg' },
      { id: 'ach12', name: 'Legendary Armaments', note: 'Collect all legendary weapons' },
      { id: 'ach13', name: 'Legendary Talismans', note: 'Collect all legendary talismans' },
      { id: 'ach14', name: 'Legendary Ashen Remains', note: 'Collect all legendary ashes' },
      { id: 'ach15', name: 'Legendary Sorceries and Incantations', note: 'Collect all legendary spells' },
      { id: 'ach16', name: 'Rune Bear Slayer', note: 'Slay a Rune Bear' },
      { id: 'ach17', name: 'Dragonslayer', note: 'Slay a Dragon' },
      { id: 'ach18', name: "Renna's Rise", note: "Complete Ranni's Quest" },
      { id: 'ach19', name: 'Felled Demigod', note: 'Defeat any major boss' },
    ]
  }
];

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
const STORAGE_KEY = 'eldenring_tracker_v2';
const NOTES_KEY   = 'eldenring_notes_v2';

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function loadNotes() {
  try { return JSON.parse(localStorage.getItem(NOTES_KEY)) || {}; } catch { return {}; }
}
function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
function saveNotes(n) { localStorage.setItem(NOTES_KEY, JSON.stringify(n)); }

let state  = loadState();
let notes  = loadNotes();
let activeSection = SECTIONS[0].id;

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function getAllItems(section) {
  if (section.items) return section.items;
  return section.subsections.flatMap(s => s.items);
}

function getTotals() {
  let total = 0, done = 0;
  SECTIONS.forEach(sec => getAllItems(sec).forEach(item => { total++; if (state[item.id]) done++; }));
  return { total, done };
}

function getSectionTotals(section) {
  const items = getAllItems(section);
  return { total: items.length, done: items.filter(i => state[i.id]).length };
}

// ─────────────────────────────────────────────
// SVGs
// ─────────────────────────────────────────────
const checkSVG = `<svg width="11" height="9" viewBox="0 0 11 9" fill="none">
  <path d="M1 4L4 7.5L10 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

const pencilSVG = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none">
  <path d="M8.5 1.5L10.5 3.5L4 10H2V8L8.5 1.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
</svg>`;

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function renderItem(item) {
  const done    = !!state[item.id];
  const userNote = notes[item.id] || '';
  const hasNote  = userNote.length > 0;
  return `
    <div class="check-item-wrap ${done ? 'done' : ''}" data-id="${item.id}">
      <div class="check-item" data-id="${item.id}">
        <div class="check-box">${checkSVG}</div>
        <span class="item-name">${item.name}</span>
        ${item.note ? `<span class="item-note">${item.note}</span>` : ''}
        <button class="note-btn ${hasNote ? 'has-note' : ''}" data-note-id="${item.id}" title="Add note" onclick="toggleNote(event,'${item.id}')">
          ${pencilSVG}
        </button>
      </div>
      <div class="note-area ${hasNote ? 'open' : ''}" id="note-area-${item.id}">
        <textarea class="note-textarea"
          placeholder="Add a note... (auto-saved)"
          data-note-id="${item.id}"
          oninput="updateNote(this,'${item.id}')"
        >${escHtml(userNote)}</textarea>
      </div>
    </div>`;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderSection(section) {
  const { total, done } = getSectionTotals(section);
  const pct = total ? Math.round(done / total * 100) : 0;

  let listHTML = '';
  if (section.subsections) {
    listHTML = section.subsections.map(sub => `
      <div class="subsection">
        <div class="subsection-title">${sub.title}</div>
        <div class="checklist">${sub.items.map(renderItem).join('')}</div>
      </div>`).join('');
  } else {
    listHTML = `<div class="checklist">${section.items.map(renderItem).join('')}</div>`;
  }

  return `
    <div class="section ${section.id === activeSection ? 'active' : ''}" id="sec-${section.id}">
      <div class="section-header">
        <div class="section-title">${section.label}</div>
        <div class="section-count"><span>${done}</span> / ${total} complete</div>
      </div>
      <div class="section-progress">
        <div class="section-progress-label"><span>Progress</span><span>${pct}%</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="controls">
        <button class="ctrl-btn" onclick="markAll('${section.id}', true)">Mark All Done</button>
        <button class="ctrl-btn danger" onclick="markAll('${section.id}', false)">Clear All</button>
      </div>
      ${listHTML}
    </div>`;
}

function renderNav() {
  return SECTIONS.map(sec => {
    const { total, done } = getSectionTotals(sec);
    const pct = total ? Math.round(done / total * 100) : 0;
    return `<button class="tab-btn ${sec.id === activeSection ? 'active' : ''}" data-sec="${sec.id}">
      ${sec.label} <span style="opacity:0.5;font-size:0.85em">${pct}%</span>
    </button>`;
  }).join('');
}

function updateTotalBar() {
  const { total, done } = getTotals();
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('total-bar').style.width = pct + '%';
  document.getElementById('total-pct').textContent = pct + '%';
}

// ─────────────────────────────────────────────
// NOTE LOGIC
// ─────────────────────────────────────────────
function toggleNote(e, id) {
  e.stopPropagation();
  const area = document.getElementById('note-area-' + id);
  const isOpen = area.classList.toggle('open');
  if (isOpen) area.querySelector('textarea').focus();
}

let noteTimers = {};
function updateNote(textarea, id) {
  const val = textarea.value;
  clearTimeout(noteTimers[id]);
  noteTimers[id] = setTimeout(() => {
    notes[id] = val;
    saveNotes(notes);
    // Update button style
    const btn = document.querySelector(`.note-btn[data-note-id="${id}"]`);
    if (btn) btn.classList.toggle('has-note', val.length > 0);
  }, 400);
}

// ─────────────────────────────────────────────
// MOUNT & EVENTS
// ─────────────────────────────────────────────
function mount() {
  document.getElementById('nav-tabs').innerHTML = renderNav();
  document.getElementById('main-content').innerHTML = SECTIONS.map(renderSection).join('');
  updateTotalBar();
  attachEvents();
}

function attachEvents() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeSection = btn.dataset.sec;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById('sec-' + activeSection).classList.add('active');
      btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    });
  });

  document.querySelectorAll('.check-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.note-btn')) return;
      const id = el.dataset.id;
      state[id] = !state[id];
      saveState(state);
      el.closest('.check-item-wrap').classList.toggle('done', state[id]);
      refreshSection(activeSection);
      updateTotalBar();
    });
  });
}

function refreshSection(secId) {
  const section = SECTIONS.find(s => s.id === secId);
  if (!section) return;
  const { total, done } = getSectionTotals(section);
  const pct = total ? Math.round(done / total * 100) : 0;
  const sec = document.getElementById('sec-' + secId);
  sec.querySelector('.section-count').innerHTML = `<span>${done}</span> / ${total} complete`;
  const labels = sec.querySelectorAll('.section-progress-label span');
  labels[1].textContent = pct + '%';
  sec.querySelector('.section-progress .progress-fill').style.width = pct + '%';
  const tab = document.querySelector(`.tab-btn[data-sec="${secId}"] span`);
  if (tab) tab.textContent = pct + '%';
}

function markAll(secId, value) {
  const section = SECTIONS.find(s => s.id === secId);
  if (!section) return;
  getAllItems(section).forEach(item => { state[item.id] = value; });
  saveState(state);
  document.getElementById('sec-' + secId).querySelectorAll('.check-item-wrap').forEach(el => {
    el.classList.toggle('done', !!state[el.dataset.id]);
  });
  refreshSection(secId);
  updateTotalBar();
}

mount();
</script>
</body>
</html>
